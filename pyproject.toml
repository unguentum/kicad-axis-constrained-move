[project]
name = "kicad-move-aligned-to"
version = "0.1.0"
description = "Align a KiCad PCB selection to a reference selection, then move on the preserved axis"
requires-python = ">=3.10"
dependencies = ["kicad-python>=0.7.0,<0.10"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 99
target-version = "py310"
