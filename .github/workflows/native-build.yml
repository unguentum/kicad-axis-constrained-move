name: Native KiCad build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-kicad:
    name: Patched KiCad
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
      - uses: DeterminateSystems/nix-installer-action@v17
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - name: Build patched KiCad
        run: nix build .#patched-kicad --print-build-logs --keep-going
      - name: Smoke-test executables
        run: |
          test -x result/bin/kicad
          test -x result/bin/pcbnew
          file result/bin/kicad result/bin/pcbnew
      - name: Capture KiCad workflow screenshots
        run: nix develop -c bash scripts/capture_screenshots.sh
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: move-aligned-screenshots
          path: |
            screenshots/move-aligned-dialog.png
            screenshots/axis-constrained-move.png
          if-no-files-found: error
