name: One-shot native dispatch

on:
  push:
    paths:
      - ".github/workflows/dispatch-native.yml"

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove this one-shot workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/dispatch-native.yml
          git commit -m "Remove completed native dispatch workflow"
          git push origin HEAD:main
      - name: Dispatch final native integration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/unguentum/kicad-axis-constrained-move/actions/workflows/native-build.yml/dispatches \
            -d '{"ref":"main"}'
